[build-system]
requires = ["setuptools>=80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pingouin"
description = "Pingouin: statistical package for Python"
readme = "README.rst"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "Raphael Vallat", email = "raphaelvallat9@gmail.com"},
]
maintainers = [
    {name = "Raphael Vallat", email = "raphaelvallat9@gmail.com"},
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.1",
    "numpy>=2.2.2",
    "pandas>=2.3.0",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
    "tabulate",
]

[project.optional-dependencies]
extras = [
    "mpmath",
    "statsmodels>=0.14.5",
]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff==0.15.8",  # Keep in sync with .pre-commit-config.yaml and .github/workflows/ruff.yml
    "pytest>=6",
    "pytest-cov",
    # Ensure coverage is new enough for `source_pkgs`.
    "coverage[toml]>=5.3",
    "mpmath",
    "statsmodels>=0.14.5",
]
docs = [
    "sphinx>7.0.0",
    "pydata_sphinx_theme",
    "numpydoc",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-notfound-page",
]


[project.urls]
Homepage = "https://pingouin-stats.org/index.html"
Source = "https://github.com/raphaelvallat/pingouin/"
Issues = "https://github.com/raphaelvallat/pingouin/issues"
Changelog = "https://pingouin-stats.org/changelog.html"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
pingouin = [
    "datasets/*.csv",
]

[tool.setuptools.packages.find]
namespaces = false
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pingouin.__version__"}

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--showlocals --durations=10"
doctest_optionflags= ["NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL", "NUMBER"]
filterwarnings = [
    # Unexpected warnings raised by pingouin are errors: expected warnings must be checked with
    # pytest.warns. Pingouin warns with stacklevel=2, so the warnings of the public functions are
    # attributed to the test modules, and those of the internal functions to pingouin.
    "error::UserWarning:(pingouin|tests).*",
    "error::RuntimeWarning:(pingouin|tests).*",
    # Deprecations raised by pingouin, or by a dependency called from pingouin
    "error::FutureWarning:(pingouin|tests).*",
    "error::DeprecationWarning:(pingouin|tests).*",
    # Raised by every call to corr(method="skipped"), including the docstring examples
    "ignore:The skipped correlation relies:UserWarning",
    # seaborn's boxplot with matplotlib >= 3.10
    "ignore:vert. bool will be deprecated:PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "*/datasets/*",
]
source_pkgs = ["pingouin"]

[tool.coverage.paths]
# CI tests the installed package: map site-packages back to src
source = ["src", "*/site-packages"]

[tool.coverage.report]
show_missing = true
# sort = "Cover"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "__init__.py",  # Skip init files bc they use star imports (breaking rules F403, F405)
    "notebooks",  # Skip jupyter notebook examples
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.flake8-import-conventions.aliases]
"matplotlib.pyplot" = "plt"
numpy = "np"
"numpy.typing" = "npt"
pandas = "pd"
seaborn = "sns"
scipy = "sp"

[tool.ruff.lint]
select = [
    "E4",  # Subset of pycodestyle rules
    "E7",  # Subset of pycodestyle rules
    "E9",  # Subset of pycodestyle rules
    "F",  # All Pyflakes rules
    "NPY", # numpy
    "W",
    "I",
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
]

ignore = [
    "NPY002" # exlude numpy random
]