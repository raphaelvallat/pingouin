name: Ruff
on: [push, pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: "Linting"
        run: uvx ruff@0.15.8 check  # Keep in sync with pyproject.toml
      - name: "Formatting"
        run: uvx ruff@0.15.8 format --check
