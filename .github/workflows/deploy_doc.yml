name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue deployments instead of cancelling them: GitHub advises against cancelling an in-progress
# Pages deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-to-gh-pages:
    # Only deploy main, including when the workflow is started manually from another branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: documentation-github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      FORCE_COLOR: true
      UV_SYSTEM_PYTHON: 1
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version-file: "pyproject.toml"
    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        enable-cache: true
        prune-cache: false
        cache-dependency-glob: pyproject.toml
        cache-suffix: docs
    - name: Install dependencies
      run: |
        uv pip install --group=docs --editable .
    - name: Build documentation
      run: |
        make -C docs clean
        make -C docs html
    - name: Upload artifact
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
      with:
        path: 'docs/build/html'
    - id: deployment
      name: Deploy to GitHub Pages
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
