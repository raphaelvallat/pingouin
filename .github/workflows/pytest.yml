name: PyTest

on:
  push:
    branches: [main]
    paths: &test-paths
      - 'src/**'
      - 'tests/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/pytest.yml'
  pull_request:
    branches: [main]
    paths: *test-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  UV_SYSTEM_PYTHON: 1

jobs:
  test-core:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.platform }}
    env:
      COVERAGE_JOB: ${{ matrix.platform == 'ubuntu-latest' && matrix.python-version == '3.14' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          prune-cache: false
          # There is no uv.lock: key the cache on the dependencies declared in pyproject.toml
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: |
          uv pip install --group=dev .

      # Use the environment installed above: `uv run` would create and sync a separate .venv
      - name: Test with pytest
        if: env.COVERAGE_JOB != 'true'
        run: pytest --verbose

      # Coverage is measured on one job only, instead of a separate workflow running the same tests
      - name: Test with pytest and coverage
        if: env.COVERAGE_JOB == 'true'
        run: pytest --cov --cov-report=xml --verbose

      - name: Upload coverage to Codecov
        if: env.COVERAGE_JOB == 'true'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

      # Docstring examples are only checked on one job: printed outputs depend on library versions.
      # --pyargs collects the installed package, the same copy as the unit tests, instead of src/.
      - name: Test docstring examples
        if: env.COVERAGE_JOB == 'true'
        run: pytest --doctest-modules --pyargs pingouin --verbose

  # Test against different dependency versions
  test-dependency-combinations:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
        deps:
          # Minimal supported versions and increasing gradually
          - python-version: "3.11"
            scipy: "scipy==1.15.0"
            numpy: "numpy==2.2.2"
            pandas: "pandas==2.3.0"
            statsmodels: "statsmodels==0.14.5"
            scikit-learn: "scikit-learn==1.6.1"
            matplotlib: "matplotlib==3.10.1"
            seaborn: "seaborn==0.13.2"
            label: "old-versions"

          - python-version: "3.12"
            scipy: "scipy==1.16.0"
            numpy: "numpy==2.3.0"
            pandas: "pandas==2.3.3"
            statsmodels: "statsmodels==0.14.5"
            scikit-learn: "scikit-learn==1.7.0"
            label: "mid-versions"

          - python-version: "3.13"
            scipy: "scipy==1.17.0"
            numpy: "numpy==2.4.0"
            pandas: "pandas==3.0.0"
            statsmodels: "statsmodels==0.14.6"
            scikit-learn: "scikit-learn==1.7.2"
            label: "recent-versions"

          # The latest versions are tested in test-core

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Set up Python ${{ matrix.deps.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.deps.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: pyproject.toml
          cache-suffix: ${{ matrix.deps.label }}

      - name: Install numpy (${{ matrix.deps.label }})
        run: uv pip install "${{ matrix.deps.numpy }}"

      # matplotlib and seaborn are only pinned in the old-versions row, the latest otherwise
      - name: Install dependencies (${{ matrix.deps.label }})
        run: >-
          uv pip install --group=dev .
          "${{ matrix.deps.scipy }}"
          "${{ matrix.deps.pandas }}"
          "${{ matrix.deps.statsmodels }}"
          "${{ matrix.deps.scikit-learn }}"
          "${{ matrix.deps.matplotlib || 'matplotlib' }}"
          "${{ matrix.deps.seaborn || 'seaborn' }}"

      - name: Display installed versions
        run: |
          python -c "import scipy; print(f'scipy: {scipy.__version__}')"
          python -c "import numpy; print(f'numpy: {numpy.__version__}')"
          python -c "import pandas; print(f'pandas: {pandas.__version__}')"
          python -c "import statsmodels; print(f'statsmodels: {statsmodels.__version__}')"
          python -c "import sklearn; print(f'scikit-learn: {sklearn.__version__}')"
          python -c "import matplotlib; print(f'matplotlib: {matplotlib.__version__}')"
          python -c "import seaborn; print(f'seaborn: {seaborn.__version__}')"

      - name: Test with pytest
        run: pytest --verbose
